services:

  # ==========================================
  # 1. POSTGRESQL - Backend de metadatos MLflow
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: bankinsight-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - bankinsight-network

  # ==========================================
  # 2. SILO - Almacenamiento de artefactos S3
  # ==========================================
  minio:
    image: docker.io/pgsty/silo:RELEASE.2026-10-26T00-00-00Z
    container_name: bankinsight-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "silo", "healthcheck", "ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - bankinsight-network


  # ==========================================
  # 3. SILO INIT - Creación del bucket
  # ==========================================
  minio-init:
    image: docker.io/pgsty/silo:RELEASE.2026-10-26T00-00-00Z
    container_name: bankinsight-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MLFLOW_ARTIFACTS_BUCKET: ${MLFLOW_ARTIFACTS_BUCKET}
    entrypoint:
      - /bin/sh
      - -c
    command:
      - |
        set -eu
        until mcli alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do
          echo "Esperando a SILO..."
          sleep 2
        done
        mcli mb --ignore-existing "local/$$MLFLOW_ARTIFACTS_BUCKET"
        echo "Bucket de MLflow preparado."
    restart: "no"
    networks:
      - bankinsight-network

  # ==========================================
  # 4. MLFLOW - Tracking y Model Registry
  # ==========================================
  mlflow:
    build:
      context: .
      dockerfile: docker/mlflow/Dockerfile
    container_name: bankinsight-mlflow
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_DEFAULT_REGION: us-east-1
    command:
      - mlflow
      - server
      - --backend-store-uri
      - postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - --artifacts-destination
      - s3://${MLFLOW_ARTIFACTS_BUCKET}
      - --host
      - 0.0.0.0
      - --port
      - "5000"
    ports:
      - "127.0.0.1:5000:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - bankinsight-network

  # ==========================================
  # 5. FASTAPI - Servicio de inferencia
  # ==========================================
  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    container_name: bankinsight-api
    restart: unless-stopped
    depends_on:
      mlflow:
        condition: service_healthy
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_MODEL_NAME: BankInsight-Campaign-Subscription
      MLFLOW_MODEL_ALIAS: candidate

      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - bankinsight-network

# ==========================================
# VOLÚMENES PERSISTENTES
# ==========================================
volumes:
  postgres_data:
  minio_data:

# ==========================================
# RED INTERNA
# ==========================================
networks:
  bankinsight-network:
    driver: bridge
